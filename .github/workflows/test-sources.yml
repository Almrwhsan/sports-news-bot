name: Test News Sources

on:
  workflow_dispatch:

jobs:
  test-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Show global sources file
        run: |
          echo "==================================="
          echo "     GLOBAL SOURCES FILE"
          echo "==================================="
          nl -ba sources/global_sources.py

      - name: Test global sources
        run: |
          echo "==================================="
          echo "       TESTING GLOBAL SOURCES"
          echo "==================================="
          python test_sources.py
