name: Test Translation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-translation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run translation test
        run: python test_translation_fix.py
