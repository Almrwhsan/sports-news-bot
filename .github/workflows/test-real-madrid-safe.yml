
name: Safe Real Madrid Bot Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-madrid-safe-test
  cancel-in-progress: false

jobs:
  safe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FACEBOOK_ENABLED: "false"

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile bot.py
          python -m py_compile image_fetcher.py
          python -m py_compile image_generator.py
          python -m py_compile facebook_publisher.py
          python -m py_compile sources/source_manager.py
          python -m py_compile sources/news_translator.py
          python -m py_compile sources/news_formatter.py
          python -m py_compile sources/news_deduplicator.py
          python -m py_compile sources/real_madrid_sources.py
          python -m py_compile sources/real_madrid_filter.py
          python -m py_compile sources/real_madrid_config.py

      - name: Check project imports
        run: |
          python -c "import bot; print('IMPORTS OK')"

      - name: Run bot with Facebook disabled
        run: |
          python bot.py

      - name: Confirm safe test completed
        if: success()
        run: |
          echo "SAFE TEST COMPLETED"
          echo "Facebook publishing was disabled."
          echo "No repository files were pushed."
