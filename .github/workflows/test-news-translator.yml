name: Test News Translator

on:
  workflow_dispatch:

jobs:
  test-news-translator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test news translator
        run: |
          echo "==================================="
          echo "       TESTING NEWS TRANSLATOR"
          echo "==================================="
          python test_news_translator.py
