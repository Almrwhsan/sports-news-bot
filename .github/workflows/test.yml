name: Test Live Stream Manager

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: live_stream_manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Run HLS Monitor
        run: |
          python stream_manager.py

      - name: Run FFmpeg HLS Test
        run: |
          python ffmpeg_test.py

      - name: Run Facebook Live Test
        env:
          FACEBOOK_RTMPS_URL: ${{ secrets.FACEBOOK_RTMPS_URL }}
          FACEBOOK_STREAM_KEY: ${{ secrets.FACEBOOK_STREAM_KEY }}
        run: |
          python facebook_live.py

      - name: Show generated playlist
        run: |
          echo "===== live_playlist.m3u ====="
          cat live_playlist.m3u

      - name: Show log
        run: |
          echo "===== logs/stream_manager.log ====="
          cat logs/stream_manager.log

      - name: Upload FFmpeg test video
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-test-video
          path: live_stream_manager/ffmpeg_test_output.mp4
