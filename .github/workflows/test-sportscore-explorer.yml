name: Test SportScore Explorer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run SportScore Explorer
        run: |
          python sportscore_match_explorer.py

      - name: Upload raw SportScore JSON
        uses: actions/upload-artifact@v4
        with:
          name: sportscore-match-data
          path: sportscore_match_raw.json
