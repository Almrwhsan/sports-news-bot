name: Test Dedup Logic

on:
  workflow_dispatch:

jobs:
  test-dedup-logic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test deduplication logic
        run: |
          echo "==================================="
          echo "       TESTING DEDUP LOGIC"
          echo "==================================="
          python test_dedup_logic.py
