name: Test News Formatter

on:
  workflow_dispatch:

jobs:
  test-news-formatter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test news formatter
        run: |
          echo "==================================="
          echo "       TESTING NEWS FORMATTER"
          echo "==================================="
          python test_news_formatter.py
