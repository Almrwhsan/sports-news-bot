name: Test Image Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test image generator
        run: |
          python image_generator.py

      - name: Check generated image
        run: |
          echo "Generated images:"
          ls -lah generated_images

      - name: Save generated images
        run: |
          git config user.name "Sports News Bot"
          git config user.email "actions@github.com"

          git add generated_images/

          if git diff --cached --quiet; then
            echo "No new images to save."
          else
            git commit -m "Add generated news images"
            git pull --rebase origin main
            git push origin main
          fi
