name: Test SportScore Live Teams

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-live-teams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live team discovery test
        run: |
          python test_sportscore_live_teams.py
