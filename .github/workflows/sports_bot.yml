name: Sports News Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        run: python bot.py
