name: Sports News Bot

on:
  workflow_dispatch:

concurrency:
  group: sports-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py

      - name: Prepare news database
        run: git add news.json

      - name: Commit news database
        run: |
          git diff --cached --quiet && echo "No changes to save." || git commit -m "Update football news database"

      - name: Update repository
        run: git pull --rebase origin main

      - name: Push news database
        run: git push origin HEAD:main          git add news.json

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update football news database"

          git pull --rebase origin main

          git push origin HEAD:main          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update football news database"
            git push
          fi
