name: Test Arabic Sources

on:
  workflow_dispatch:

jobs:
  test-arabic-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Arabic sources
        run: |
          echo "==================================="
          echo "       TESTING ARABIC SOURCES"
          echo "==================================="
          python test_arabic_sources.py
