name: Test Live Stream Manager

on:
  workflow_dispatch:
  push:
    paths:
      - "config.json"
      - "stream_manager.py"
      - "requirements.txt"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stream manager
        run: |
          python stream_manager.py

      - name: Show generated playlist
        run: |
          echo "===== live_playlist.m3u ====="
          cat live_playlist.m3u
